server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Angular SPA and handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy - keeps the browser on a single origin so an https
    # page never issues a blocked http:// request (mixed content).
    # ^~ stops the regex asset block below from hijacking proxied paths.
    location ^~ /api/ {
        proxy_pass http://41.59.225.78:8018;
        proxy_http_version 1.1;
        # Identity encoding so sub_filter can rewrite the JSON body below.
        proxy_set_header Accept-Encoding "";
        # The API returns absolute http:// object-store URLs for images, which
        # would be mixed content on an https page. Point them at /media/.
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter "http://41.59.228.129:9000/" "/media/s1/";
        sub_filter "http://41.59.225.78:9000/"  "/media/s2/";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_redirect http://41.59.225.78:8018/ /;
    }

    # Object storage, addressed by opaque key so the public URL never exposes
    # the storage host. Presigned URLs sign the Host header, so the upstream's
    # own host must be sent here - not $host.
    location ^~ /media/s1/ {
        rewrite ^/media/s1/(.*)$ /$1 break;
        proxy_pass http://41.59.228.129:9000;
        proxy_http_version 1.1;
        proxy_set_header Host 41.59.228.129:9000;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        # Do not echo storage-server identifying headers back to the browser.
        proxy_hide_header Server;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }

    # Object storage, addressed by opaque key so the public URL never exposes
    # the storage host. Presigned URLs sign the Host header, so the upstream's
    # own host must be sent here - not $host.
    location ^~ /media/s2/ {
        rewrite ^/media/s2/(.*)$ /$1 break;
        proxy_pass http://41.59.225.78:9000;
        proxy_http_version 1.1;
        proxy_set_header Host 41.59.225.78:9000;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        # Do not echo storage-server identifying headers back to the browser.
        proxy_hide_header Server;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}

