<div class="min-h-screen bg-gray-50">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10 lg:py-12">
    <!-- Hero Section -->
    <div class="mb-8 sm:mb-10 lg:mb-12">
      <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-gray-900 mb-4 tracking-tight"
          style="font-family: 'Inter', sans-serif; letter-spacing: -0.02em;">
        Contact Us
      </h1>
      <div class="h-1 w-20 bg-primary-600 rounded-full"></div>
      <p class="text-base sm:text-lg text-gray-600 mt-4">
        Have a question or need assistance? We'd love to hear from you.
      </p>
    </div>

    <!-- Contact Form Section -->
    <div class="bg-white rounded-xl sm:rounded-2xl shadow-lg border border-gray-200 p-6 sm:p-8 lg:p-10 xl:p-12 max-w-3xl mx-auto">
      <!-- Success Message -->
      <div *ngIf="submitSuccess" 
           class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
        <div class="flex items-center">
          <svg class="w-5 h-5 text-green-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          <p class="text-sm font-medium text-green-800">
            Thank you for your message! We'll get back to you soon.
          </p>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="submitError" 
           class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
        <div class="flex items-center">
          <svg class="w-5 h-5 text-red-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <p class="text-sm font-medium text-red-800">{{ submitError }}</p>
        </div>
      </div>

      <!-- Contact Form -->
      <form (ngSubmit)="onSubmit()" class="space-y-6">
        <!-- Name Field -->
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
            Name <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="name"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm sm:text-base"
            placeholder="Your full name">
        </div>

        <!-- Email Field -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Email <span class="text-red-500">*</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm sm:text-base"
            placeholder="your.email@example.com">
        </div>

        <!-- Subject Field -->
        <div>
          <label for="subject" class="block text-sm font-medium text-gray-700 mb-2">
            Subject <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="subject"
            name="subject"
            [(ngModel)]="subject"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm sm:text-base"
            placeholder="What is your message about?">
        </div>

        <!-- Message Field -->
        <div>
          <label for="message" class="block text-sm font-medium text-gray-700 mb-2">
            Message <span class="text-red-500">*</span>
          </label>
          <textarea
            id="message"
            name="message"
            [(ngModel)]="message"
            required
            rows="6"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm sm:text-base resize-vertical"
            placeholder="Please provide details about your inquiry..."></textarea>
        </div>

        <!-- Submit Button -->
        <div class="flex items-center justify-end gap-4">
          <button
            type="button"
            (click)="resetForm()"
            class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg font-medium text-sm sm:text-base
                   hover:bg-gray-50 transition-colors duration-200 shadow-sm hover:shadow-md">
            Clear
          </button>
          <button
            type="submit"
            [disabled]="isSubmitting"
            class="px-6 py-3 bg-primary-600 text-white rounded-lg font-medium text-sm sm:text-base
                   hover:bg-primary-700 transition-colors duration-200 shadow-sm hover:shadow-md
                   disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
            <span *ngIf="!isSubmitting">Send Message</span>
            <span *ngIf="isSubmitting" class="flex items-center gap-2">
              <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Sending...
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
