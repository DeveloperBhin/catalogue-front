
<header class="header-modern">

  <!-- =====================================
       GOVERNMENT BANNER
  ====================================== -->
  <div class="government-banner">
    <div class="header-container">

      <!-- Tanzania Coat of Arms -->
      <div class="banner-left">
        <img
          src="assets/images/emblem.png"
          alt="Coat of Arms of Tanzania"
          class="government-emblem"
        />
      </div>

      <!-- Institute Information -->
      <div class="banner-center">

        <p class="country-name">
          The United Republic of Tanzania
        </p>

        <h1 class="institute-name">
          TANZANIA AGRICULTURAL RESEARCH INSTITUTE
        </h1>

        <p class="institute-acronym">
          Crop Catalogue Portal
        </p>

      </div>

      <!-- TARI Logo -->
      <div class="banner-right">
        <img
          src="assets/images/tari-logo.png"
          alt="TARI Logo"
          class="tari-logo"
        />
      </div>

    </div>
  </div>

  <!-- =====================================
       NAVIGATION BAR
  ====================================== -->
  <nav
    class="header-navigation"
    aria-label="Main navigation">

    <div class="nav-container">

      <!-- LEFT: BACK BUTTON -->
      <button
        *ngIf="showBackButton"
        type="button"
        class="back-button"
        (click)="navigateBack()"
        [attr.aria-label]="backButtonLabel">

        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">

          <path d="M15 18l-6-6 6-6"></path>
          <path d="M9 12h12"></path>

        </svg>

        <span>{{ backButtonLabel }}</span>

      </button>

      <!-- RIGHT: DESKTOP NAVIGATION -->
      <div class="desktop-navigation">

        <!-- Navigation Links -->
        <div class="desktop-links">

          <a
            routerLink="/new-home"
            routerLinkActive="header-nav-active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="header-nav-link">
            Home
          </a>

          <a
            routerLink="/"
            routerLinkActive="header-nav-active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="header-nav-link">
            Our Crops
          </a>

          <a
            routerLink="/about"
            routerLinkActive="header-nav-active"
            class="header-nav-link">
            About Us
          </a>

          <a
            routerLink="/contact"
            routerLinkActive="header-nav-active"
            class="header-nav-link">
            Contact Us
          </a>

        </div>

        <!-- Language Selector -->
        <div class="language-selector">

          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true">

            <circle cx="12" cy="12" r="10"></circle>
            <path d="M2 12h20"></path>
            <path
              d="M12 2a15.3 15.3 0 0 1 4 10
                 15.3 15.3 0 0 1-4 10
                 15.3 15.3 0 0 1-4-10
                 15.3 15.3 0 0 1 4-10">
            </path>

          </svg>

          <select
            aria-label="Select language"
            [ngModel]="selectedLanguage"
            (ngModelChange)="changeLanguage($event)">

            <option value="en">🇬🇧 EN</option>
            <option value="sw">🇹🇿 SW</option>

          </select>

        </div>

        <!-- Login and Register -->
        <div class="auth-buttons">

          <a
            routerLink="/login"
            class="login-button">
            Login
          </a>

          <a
            routerLink="/register"
            class="register-button">
            Register
          </a>

        </div>

      </div>

      <!-- MOBILE MENU TOGGLE -->
      <button
        type="button"
        class="mobile-menu-button"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen"
        aria-controls="tari-mobile-navigation"
        aria-label="Toggle navigation menu">

        <svg
          *ngIf="!isMobileMenuOpen"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round">

          <path d="M4 6h16M4 12h16M4 18h16"></path>

        </svg>

        <svg
          *ngIf="isMobileMenuOpen"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round">

          <path d="M6 6l12 12M18 6L6 18"></path>

        </svg>

      </button>

    </div>

    <!-- =====================================
         MOBILE NAVIGATION
    ====================================== -->
    <div
      id="tari-mobile-navigation"
      class="mobile-links"
      *ngIf="isMobileMenuOpen">

      <a
        routerLink="/new-home"
        routerLinkActive="header-mobile-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMobileMenu()">
        Home
      </a>

      <a
        routerLink="/"
        routerLinkActive="header-mobile-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMobileMenu()">
        Our Crops
      </a>

      <a
        routerLink="/about"
        routerLinkActive="header-mobile-active"
        (click)="closeMobileMenu()">
        About Us
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="header-mobile-active"
        (click)="closeMobileMenu()">
        Contact Us
      </a>

      <!-- Mobile Language -->
      <div class="mobile-language">

        <label for="mobile-language-select">
          Language
        </label>

        <select
          id="mobile-language-select"
          [ngModel]="selectedLanguage"
          (ngModelChange)="changeLanguage($event)">

          <option value="en">🇬🇧 English</option>
          <option value="sw">🇹🇿 Kiswahili</option>

        </select>

      </div>

      <!-- Mobile Authentication -->
      <div class="mobile-auth">

        <a
          routerLink="/login"
          class="mobile-login"
          (click)="closeMobileMenu()">
          Login
        </a>

        <a
          routerLink="/register"
          class="mobile-register"
          (click)="closeMobileMenu()">
          Register
        </a>

      </div>

    </div>

  </nav>

</header>
