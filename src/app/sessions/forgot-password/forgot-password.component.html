
<main class="auth-page">
  <section class="auth-card">

    <div class="brand">
<img
          src="assets/images/logo.png"
          alt="TARI Logo"
          class="brand-logo"
        />      <div>
        <strong>TARI-VMS</strong>
        <small>Vehicle Management System</small>
      </div>
    </div>

    <div class="symbol">✉</div>

    <h1>Forgot Password?</h1>

    <p class="subtitle">
      Enter your registered email address.
      We will send you a link to reset your password.
    </p>

    <div
      *ngIf="success"
      class="notice success"
      role="status"
    >
      If an account exists with this email address,
      a password reset link will be sent shortly.
    </div>

    <form
      *ngIf="!success"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >

      <label for="email">Email Address</label>

      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="name@tari.go.tz"
        autocomplete="email"
      />

      <small
        class="field-error"
        *ngIf="(submitted || email.touched) && email.invalid"
      >
        Please enter a valid email address.
      </small>

      <div
        *ngIf="error"
        class="notice error"
        role="alert"
      >
        {{ error }}
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>

    </form>

    <a routerLink="/login" class="back">
      ← Back to Login
    </a>

  </section>
</main>
