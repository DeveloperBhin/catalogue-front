<div *ngIf="isOpen" 
     class="fixed inset-0 z-50 overflow-y-auto"
     (click)="closeModal()">
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
    <!-- Background overlay -->
    <div class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75" 
         (click)="closeModal()"></div>

    <!-- Modal panel -->
    <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle {{ sizeClass }} w-full"
         (click)="$event.stopPropagation()">
      <!-- Header -->
      <div class="bg-white px-4 pt-5 pb-4 sm:p-6 border-b border-gray-200" *ngIf="title">
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-medium text-gray-900">{{ title }}</h3>
          <button (click)="closeModal()" 
                  class="text-gray-400 hover:text-gray-500 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Content -->
      <div class="bg-white px-4 pt-5 pb-4 sm:p-6">
        <ng-content></ng-content>
      </div>

      <!-- Footer (optional) -->
      <div class="bg-gray-50 px-4 py-3 sm:px-6 border-t border-gray-200">
        <ng-content select="[footer]"></ng-content>
      </div>
    </div>
  </div>
</div>
