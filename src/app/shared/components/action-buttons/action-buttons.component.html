<div class="action-buttons-wrapper">

  <ng-container *ngFor="let button of actionButtons">

    <!-- ICON BUTTON -->
    <button
      *ngIf="button.type === 'icon' && !button.buttons"
      mat-icon-button
      type="button"
      class="utility-icon-btn"
      (click)="button.onClick?.(value)"
    >
      <mat-icon>
        {{ button.iconMapper ? button.iconMapper(value) : button.icon }}
      </mat-icon>
    </button>


    <!-- ICON WITH DROPDOWN -->
  <!-- ICON WITH DROPDOWN -->
<ng-container *ngIf="button.type === 'icon' && button.buttons">

  <button
    mat-icon-button
    type="button"
    class="utility-icon-btn"
    [matMenuTriggerFor]="menu"
  >
    <mat-icon>
      {{ button.iconMapper ? button.iconMapper(value) : button.icon }}
    </mat-icon>
  </button>

  <mat-menu
    #menu="matMenu"
    xPosition="before"
    yPosition="below"
    [overlapTrigger]="false"
  >
    <button
      mat-menu-item
      *ngFor="let child of button.buttons"
      (click)="child.onClick?.(value)"
    >
      {{ child.label }}
    </button>
  </mat-menu>

</ng-container>

  </ng-container>

</div>
