<div class="bg-white border border-gray-200 rounded-md overflow-hidden">
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th 
            *ngFor="let column of columns"
            class="px-6 py-3 text-left text-xs font-semibold text-gray-900 uppercase tracking-wider">
            {{ column.label }}
          </th>
        </tr>
      </thead>
      <tbody [class]="'bg-white divide-y divide-gray-200' + (striped ? ' divide-y' : '')">
        <tr 
          *ngFor="let row of data; let i = index"
          [class]="(hover ? 'hover:bg-gray-50' : '') + (striped && i % 2 === 0 ? ' bg-gray-50' : '')">
          <td 
            *ngFor="let column of columns"
            class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            {{ row[column.key] }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- Empty State -->
  <div *ngIf="data.length === 0" class="text-center py-8">
    <p class="text-gray-500">No data available</p>
  </div>
</div>
